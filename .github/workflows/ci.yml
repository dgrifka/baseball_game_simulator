name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what the daily bake runs on; 3.12 is what development uses.
        # Both are tested because the pickled model artifact and the pinned
        # scikit-learn have to load under either.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # Install with uv, matching how the pipeline installs this repo's
      # requirements in production. Pinned so a uv release cannot change
      # resolution under us.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          # Caching is off because it was measured to cost more than it saves.
          # On 2026-11-24 all four jobs missed the cache, downloaded 27 packages
          # in about a second, then spent 3-4s saving ~95 MB. Caches saved on a
          # pull request are not readable from main, and entries expire after
          # 7 idle days while runs here are weeks apart.
          enable-cache: false

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt pytest==9.0.3

      - name: Run tests
        # tests/ covers the venue-id regression, an import-smoke over every
        # module the daily bake depends on, and asset-presence for the model
        # CSVs. This is what would have caught the best_batted_balls import break.
        # It also pins the feature-frame column order, calls predict_proba on the
        # shipped pickle, and checks scalar/vector engine parity. Runs once per
        # interpreter in the matrix above.
        run: pytest tests/ -q
